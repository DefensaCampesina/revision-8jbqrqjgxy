<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — Red Nacional por la Defensa de la Reforma Agraria</title>
<!-- Sin fuentes, imágenes ni guiones a propósito. Cloudflare Pages sirve este
     archivo en CUALQUIER dirección que no exista (/lo/que/sea), así que una
     dirección relativa se resolvería contra esa ruta falsa y pediría otro
     archivo que tampoco existe. Antes de este archivo, Cloudflare respondía
     con la portada entera (9 MB) a cualquier ruta rota. Los enlaces van desde
     la raíz del dominio por la misma razón. -->
<style>
:root{--olivo-hondo:#2F3A1A;--olivo:#46551F;--tierra:#8C4415;--suave:#ECF0E4;--tinta:#1C2113;--gris:#5F6752;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--suave);color:var(--tinta);font:400 17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
.cab{background:var(--olivo-hondo);color:#fff;padding:18px 20px;font-weight:700;letter-spacing:.02em}
main{flex:1;display:flex;align-items:center;padding:40px 20px}
.caja{max-width:620px;margin:0 auto}
.rot{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tierra);margin-bottom:10px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;color:var(--olivo-hondo);margin-bottom:14px}
p{margin-bottom:1em}
.acc{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
a.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;border-radius:10px;padding:12px 18px;
  border:1.5px solid #DBE1CE;background:#fff;color:var(--olivo)}
a.btn-1{background:var(--olivo);border-color:var(--olivo);color:#fff}
:focus-visible{outline:3px solid #B87A20;outline-offset:2px}
</style>
</head>
<body>
<header class="cab">Red Nacional por la Defensa de la Reforma Agraria</header>
<main>
  <div class="caja">
    <p class="rot">Error 404</p>
    <h1>Esta página no existe</h1>
    <p>La dirección que abrió no corresponde a ninguna página del sitio de la Red. Puede que el
      enlace esté incompleto o que la página haya cambiado de lugar.</p>
    <div class="acc">
      <a class="btn btn-1" href="/">Ir al sitio de la Red</a>
      <a class="btn" href="/publicaciones/">Ver las publicaciones</a>
    </div>
  </div>
</main>
</body>
</html>
