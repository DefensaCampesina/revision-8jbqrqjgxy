:root{
  --olivo-hondo:#2F3A1A; --olivo:#46551F; --olivo-vivo:#7A9A2E;
  --tierra:#8C4415; --ocre:#B87A20; --ocre-texto:#925E15;
  --papel:#fff; --suave:#ECF0E4; --tinta:#1C2113; --gris:#5F6752;
  --linea:#DBE1CE; --alerta:#B3231F; --verde-ok:#2E7D32;
  --sombra:0 1px 2px rgba(47,58,26,.06),0 4px 14px rgba(47,58,26,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--suave);color:var(--tinta);
  font:400 15.5px/1.6 "RedTexto",system-ui,-apple-system,Segoe UI,sans-serif}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ocre);outline-offset:2px;border-radius:3px}
.tit{font-family:"RedTitular",Arial Narrow,sans-serif;font-weight:800;text-transform:uppercase;
  line-height:1.02;margin:0}

/* ── puerta ── */
#pantallaEntrar{min-height:100vh;display:grid;place-items:center;padding:24px}
.puerta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;
  padding:34px 32px;max-width:400px;width:100%;box-shadow:var(--sombra)}
.puerta img{height:46px;width:auto;margin-bottom:20px}
.puerta h1{font-size:22px;margin-bottom:8px}
.puerta p{font-size:14px;color:var(--gris);margin-bottom:20px}
.puerta label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.puerta input{width:100%;font:400 15px/1.5 "RedTexto",sans-serif;padding:11px 13px;
  border:1.5px solid var(--linea);border-radius:10px;margin-bottom:14px}

#pantallaModulo{display:none}
#pantallaModulo.viva{display:block}

.barra{background:var(--olivo-hondo);color:#fff;padding:14px 0}
.caja{max-width:1240px;margin:0 auto;padding:0 20px}
.barra .caja{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.barra img{height:34px;width:auto}
.barra b{font:800 15px/1 "RedTitular",sans-serif;text-transform:uppercase}
.barra .quien{margin-left:auto;font-size:13.5px;color:#D9D5C4}

.pest{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin:22px 0 20px}
.pest button{font:600 14.5px/1 "RedTexto",sans-serif;background:none;border:0;cursor:pointer;
  padding:12px 18px;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-1px}
.pest button.on{color:var(--olivo);border-bottom-color:var(--olivo)}
.vista{display:none} .vista.viva{display:block}

.btn{font:600 14.5px/1 "RedTexto",sans-serif;border:0;border-radius:10px;padding:11px 18px;
  cursor:pointer;background:var(--olivo);color:#fff}
.btn:hover{background:var(--olivo-hondo)}
.btn.suave{background:var(--papel);color:var(--olivo);border:1.5px solid var(--linea)}
.btn.suave:hover{background:var(--suave)}
.btn:disabled{opacity:.6;cursor:default}

.herr{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.herr input[type=text], .herr select{font:400 14.5px/1 "RedTexto",sans-serif;padding:10px 12px;
  border:1.5px solid var(--linea);border-radius:9px;background:var(--papel);color:var(--tinta)}
.herr input[type=text]{flex:1 1 240px}

/* ── matriz ── */
.marco{background:var(--papel);border:1px solid var(--linea);border-radius:14px;
  overflow:auto;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--linea);vertical-align:top}
th{background:var(--suave);font:600 12.5px/1.3 "RedTexto",sans-serif;text-transform:uppercase;
  letter-spacing:.03em;color:var(--gris);position:sticky;top:0;cursor:pointer;white-space:nowrap}
th:hover{color:var(--olivo)}
tbody tr:hover{background:#F7F9F2}
td.cod{font-weight:600;color:var(--olivo);white-space:nowrap}
.marca{display:inline-block;font:600 11.5px/1 "RedTexto",sans-serif;border-radius:20px;
  padding:5px 10px;white-space:nowrap}
.m-Recibido{background:#EDF0E2;color:var(--gris)}
.m-Enverificación{background:#FBF3E6;color:var(--ocre-texto)}
.m-Verificado{background:#E4F0E5;color:var(--verde-ok)}
.m-Vinculado{background:var(--olivo);color:#fff}
.m-Noprocede{background:#F6E4E3;color:var(--alerta)}
.m-Archivado{background:#E8E8E4;color:#8B9280}
.chip{display:inline-block;background:var(--suave);border-radius:6px;padding:3px 8px;
  font-size:12.5px;margin:2px 3px 2px 0;color:var(--gris)}
.vacio{padding:34px;text-align:center;color:var(--gris);font-size:15px}

/* ── tablero ── */
.rej{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:20px}
.tarj{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:20px 22px;
  box-shadow:var(--sombra)}
.tarj .n{font:800 34px/1 "RedTitular",serif;color:var(--olivo)}
.tarj .q{font-size:13.5px;color:var(--gris);margin-top:5px}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:22px 24px;
  box-shadow:var(--sombra);margin-bottom:16px}
.panel h3{font:800 15px/1.2 "RedTitular",sans-serif;text-transform:uppercase;
  color:var(--tierra);margin-bottom:14px}
.barras{display:grid;gap:9px}
.barra-f{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:11px;align-items:center;
  font-size:14px}
.barra-f .via{background:var(--suave);border-radius:5px;height:19px;overflow:hidden}
.barra-f .via i{display:block;height:100%;background:var(--olivo-vivo);border-radius:5px}
.barra-f .c{font-weight:600;color:var(--gris);font-size:13px;min-width:2.5em;text-align:right}

/* ── ficha ── */
#velo{position:fixed;inset:0;background:rgba(28,33,19,.55);display:none;place-items:center;
  padding:22px;z-index:40}
#velo.viva{display:grid}
.ficha{background:var(--papel);border-radius:16px;max-width:760px;width:100%;
  max-height:88vh;overflow:auto;padding:28px 30px}
.ficha h2{font:800 20px/1.2 "RedTitular",sans-serif;text-transform:uppercase;margin-bottom:4px}
.ficha .sub{font-size:13.5px;color:var(--gris);margin-bottom:20px}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-bottom:20px}
.ficha dt{font:600 12.5px/1.5 "RedTexto",sans-serif;text-transform:uppercase;color:var(--gris);
  letter-spacing:.03em;white-space:nowrap}
.ficha dd{margin:0;font-size:14.5px}
.ficha .rev{border-top:1px solid var(--linea);padding-top:18px;margin-top:4px}
.ficha .rev label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.ficha .rev select, .ficha .rev input, .ficha .rev textarea{width:100%;font:400 14.5px/1.5 "RedTexto",sans-serif;
  padding:10px 12px;border:1.5px solid var(--linea);border-radius:9px;margin-bottom:14px}
.ficha .rev textarea{min-height:80px;resize:vertical}
.ficha .pie{display:flex;gap:9px;justify-content:flex-end;margin-top:6px}
.reserva{display:inline-block;font:600 10.5px/1 "RedTexto",sans-serif;text-transform:uppercase;
  letter-spacing:.04em;background:#FBF3E6;color:var(--ocre-texto);border-radius:5px;
  padding:4px 7px;margin-left:7px;vertical-align:middle}
.error{background:#F6E4E3;border:1.5px solid #E3B5B3;border-radius:10px;padding:12px 15px;
  font-size:14px;color:var(--alerta);margin-bottom:14px}
main{padding-bottom:60px}
</style>

    <b>Organizaciones aliadas</b>
    <span class="quien" id="quien"></span>
    <button class="btn suave" id="btnActualizar">Actualizar</button>
  </div></div>

  <main class="caja">
    <div class="pest">
      <button data-v="matriz" class="on">Matriz de registros</button>
      <button data-v="tablero">Tablero</button>
    </div>

    <section class="vista viva" id="vMatriz">
      <div class="herr">
        <input type="text" id="buscar" placeholder="Buscar por nombre, territorio o acción…">
        <select id="fEstado"><option value="">Todos los estados</option></select>
        <select id="fTipo"><option value="">Todos los tipos</option></select>
        <select id="fDpto"><option value="">Todos los departamentos</option></select>
        <button class="btn suave" id="btnLimpiar">Limpiar</button>
        <button class="btn suave" id="btnExcel">Exportar a Excel</button>
      </div>
      <div class="marco"><div id="tabla"></div></div>
    </section>

    <section class="vista" id="vTablero">
      <div class="rej" id="cifras"></div>
      <div class="panel"><h3>Por tipo de organización</h3><div class="barras" id="porTipo"></div></div>
      <div class="panel"><h3>Acciones de interés</h3><div class="barras" id="porAccion"></div></div>
      <div class="panel"><h3>Presencia por departamento</h3><div class="barras" id="porDpto"></div></div>
      <div class="panel"><h3>Estado de la revisión</h3><div class="barras" id="porEstado"></div></div>
    </section>
  </main>
</div>

<div id="velo"><div class="ficha" id="ficha"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Módulo interno de organizaciones aliadas

   Dos vistas sobre lo mismo: la matriz, para trabajar registro por registro,
   y el tablero, para ver el conjunto. Las dos leen del mismo sitio, así que
   nunca se contradicen.

   El correo y el teléfono se muestran aquí porque para eso es un módulo
   interno, pero van marcados: quien copie y pegue para un documento público
   tiene que ver el aviso.
   ══════════════════════════════════════════════════════════════════════ */

const API = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
  ? '/api'
  : 'https://script.google.com/macros/s/AKfycbwiMAuwROnjeYmzGMEVbS_1FNk5C6o39bccX7K9Y1-zORcLdBWiiog1274JSz1oub6T/exec';

const CAMPOS_ORG  = [{"n":1,"titulo":"La organización","campos":[{"id":"nombre","r":"Nombre de la organización","tipo":"texto","visible":true,"obligatorio":true,"ayuda":"Como aparece en sus documentos o como se le conoce en el territorio.","pista":"Ej: Asociación de Campesinos del Sur"},{"id":"tipo","r":"Tipo de organización","tipo":"sel","visible":true,"obligatorio":true,"ops":["Organización campesina","Organización de derechos humanos","Asociación productiva","Fundación","Otra"]},{"id":"tipo_otro","r":"¿Cuál?","tipo":"texto","visible":true,"depende":{"campo":"tipo","valor":"Otra"},"pista":"Ej: Colectivo académico"},{"id":"nivel","r":"Nivel de operación","tipo":"sel","visible":true,"obligatorio":true,"ops":["Nacional","Regional"]}]},{"n":2,"titulo":"En qué quiere trabajar","nota":"Marque todas las que correspondan. Sirve para saber a quién convocar cuando se abra un frente de trabajo.","campos":[{"id":"acciones","r":"¿En cuáles acciones estaría interesada su organización?","tipo":"multi","visible":true,"ops":["Espacios de coordinación","Investigación","Formación","Incidencia institucional","Acompañamiento a comunidades","Alertas tempranas","Defensa jurídica","Elaboración de propuestas","Observatorio territorial","Análisis de políticas públicas","Comunicaciones"]}]},{"n":3,"titulo":"Dónde trabaja","nota":"Escoja el departamento y marque los municipios donde la organización tiene presencia. Puede agregar varios departamentos, uno tras otro.","campos":[{"id":"territorios","r":"Departamentos y municipios","tipo":"territorios","visible":true,"obligatorio":true}]},{"n":4,"titulo":"Contacto","campos":[{"id":"correo","r":"Correo electrónico de contacto","tipo":"correo","visible":true,"obligatorio":true,"reservado":true,"ayuda":"Por aquí la Red se comunica. No se publica en ningún documento.","pista":"contacto@organizacion.org"},{"id":"telefono","r":"Teléfono o celular (opcional)","tipo":"texto","visible":true,"reservado":true},{"id":"persona","r":"Persona de contacto (opcional)","tipo":"texto","visible":true,"reservado":true,"ayuda":"Nombre de quien atiende la relación con la Red."}]},{"n":5,"titulo":"Autorización","campos":[{"id":"habeas","r":"¿Autoriza el tratamiento de los datos de contacto de la organización, conforme a la Ley 1581 de 2012, para efectos de la articulación con la Red?","tipo":"sel","visible":true,"obligatorio":true,"ops":["Sí","No"]},{"id":"publicar","r":"¿Autoriza que el nombre de la organización aparezca en el mapa público de organizaciones aliadas?","tipo":"sel","visible":true,"obligatorio":true,"ayuda":"El correo y el teléfono nunca se publican, autorice o no esta pregunta.","ops":["Sí, puede aparecer","No, prefiero que no aparezca","Prefiero definirlo después"]}]},{"n":6,"titulo":"Revisión de la Red","soloAmpliado":true,"nota":"Lo diligencia quien revisa el registro. No lo ve la organización.","campos":[{"id":"estado_rev","r":"Estado de la revisión","tipo":"sel","visible":false,"ops":["Recibido","En verificación","Verificado","Vinculado","No procede","Archivado"]},{"id":"verificado_por","r":"Quién verificó","tipo":"texto","visible":false},{"id":"vinculo","r":"Vínculo con la Red","tipo":"sel","visible":false,"ops":["Sin contacto todavía","Contactada","Participa en un frente de trabajo","Organización miembro"]},{"id":"observaciones","r":"Observaciones","tipo":"larga","visible":false}]}];
const ESTADOS_ORG = ["Recibido","En verificación","Verificado","Vinculado","No procede","Archivado"];

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

let SESION = null, ITEMS = [], orden = { col: 'creado', asc: false };

const pedir = async (cuerpo) => {
  try {
    const r = await fetch(API, { method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'No pude conectarme.' }; }
};

/* ── entrar ── */
$('#puertaEntrar').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btnEntrar');
  b.disabled = true; b.textContent = 'Entrando…';
  const r = await pedir({ accion: 'entrar', usuario: $('#usuario').value.trim(),
                          clave: $('#clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (!r.ok) { $('#errorEntrar').innerHTML =
    `<div class="error">${esc(r.error || 'No pude entrar.')}</div>`; return; }
  SESION = r.sesion;
  $('#quien').textContent = r.nombre || '';
  $('#pantallaEntrar').style.display = 'none';
  $('#pantallaModulo').classList.add('viva');
  cargar();
});

/* ── traer los registros ── */
async function cargar() {
  const r = await pedir({ accion: 'org_listar', sesion: SESION });
  if (!r.ok) {
    $('#tabla').innerHTML = `<p class="vacio">${esc(r.error || 'No pude traer los registros.')}</p>`;
    return;
  }
  ITEMS = r.items || [];
  llenarFiltros();
  pintarMatriz();
  pintarTablero();
}
$('#btnActualizar').addEventListener('click', cargar);

/* ── filtros ── */
const dptosDe = it => (it.datos.territorios || []).map(t => t.dpto);
const tipoDe  = it => it.datos.tipo === 'Otra' ? (it.datos.tipo_otro || 'Otra') : (it.datos.tipo || '—');

function llenarFiltros() {
  const poner = (sel, titulo, vals) => {
    const el = $(sel), antes = el.value;
    el.innerHTML = `<option value="">${titulo}</option>` +
      [...new Set(vals)].filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'))
        .map(v => `<option>${esc(v)}</option>`).join('');
    el.value = antes;
  };
  poner('#fEstado', 'Todos los estados', ESTADOS_ORG);
  poner('#fTipo', 'Todos los tipos', ITEMS.map(tipoDe));
  poner('#fDpto', 'Todos los departamentos', ITEMS.flatMap(dptosDe));
}

function visibles() {
  const t = noAc($('#buscar').value.trim());
  const e = $('#fEstado').value, tp = $('#fTipo').value, dp = $('#fDpto').value;
  return ITEMS.filter(it => {
    if (e && it.estado !== e) return false;
    if (tp && tipoDe(it) !== tp) return false;
    if (dp && !dptosDe(it).includes(dp)) return false;
    if (!t) return true;
    const d = it.datos;
    return noAc([it.codigo, d.nombre, tipoDe(it), d.nivel, (d.acciones || []).join(' '),
      (d.territorios || []).map(x => x.dpto + ' ' + x.municipios.join(' ')).join(' ')
    ].join(' ')).includes(t);
  });
}
['#buscar', '#fEstado', '#fTipo', '#fDpto'].forEach(s =>
  $(s).addEventListener('input', pintarMatriz));
$('#btnLimpiar').addEventListener('click', () => {
  $('#buscar').value = ''; $('#fEstado').value = ''; $('#fTipo').value = ''; $('#fDpto').value = '';
  pintarMatriz();
});

/* ── matriz ── */
const COLS = [
  ['codigo', 'Código'], ['nombre', 'Organización'], ['tipo', 'Tipo'],
  ['nivel', 'Nivel'], ['territorios', 'Territorios'], ['acciones', 'Acciones de interés'],
  ['estado', 'Estado'], ['creado', 'Registro'],
];

const valorCol = (it, c) => {
  const d = it.datos;
  switch (c) {
    case 'codigo': return it.codigo || '';
    case 'nombre': return d.nombre || '';
    case 'tipo':   return tipoDe(it);
    case 'nivel':  return d.nivel || '';
    case 'territorios': return (d.territorios || [])
      .reduce((a, t) => a + t.municipios.length, 0);
    case 'acciones': return (d.acciones || []).length;
    case 'estado': return it.estado || '';
    case 'creado': return it.creado || '';
  }
};

function pintarMatriz() {
  const vis = visibles().slice().sort((a, b) => {
    const x = valorCol(a, orden.col), y = valorCol(b, orden.col);
    const n = typeof x === 'number' && typeof y === 'number'
      ? x - y : String(x).localeCompare(String(y), 'es');
    return orden.asc ? n : -n;
  });
  if (!vis.length) {
    $('#tabla').innerHTML = `<p class="vacio">${ITEMS.length
      ? 'Ningún registro coincide con lo que buscó.'
      : 'Todavía no ha llegado ningún registro.'}</p>`;
    return;
  }
  $('#tabla').innerHTML = `<table>
    <thead><tr>${COLS.map(([c, r]) =>
      `<th data-col="${c}">${esc(r)}${orden.col === c ? (orden.asc ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
    <tbody>${vis.map(it => {
      const d = it.datos;
      const terr = (d.territorios || []);
      return `<tr data-cod="${esc(it.codigo)}">
        <td class="cod">${esc(it.codigo)}</td>
        <td><b>${esc(d.nombre || '—')}</b></td>
        <td>${esc(tipoDe(it))}</td>
        <td>${esc(d.nivel || '—')}</td>
        <td>${terr.length
          ? terr.map(t => `<span class="chip">${esc(t.dpto)} (${t.municipios.length})</span>`).join('')
          : '<span class="chip">—</span>'}</td>
        <td>${(d.acciones || []).length
          ? (d.acciones || []).slice(0, 3).map(a => `<span class="chip">${esc(a)}</span>`).join('') +
            ((d.acciones || []).length > 3 ? `<span class="chip">+${(d.acciones).length - 3}</span>` : '')
          : '<span class="chip">—</span>'}</td>
        <td><span class="marca m-${esc(String(it.estado || 'Recibido').replace(/\s+/g, ''))}">${esc(it.estado || 'Recibido')}</span></td>
        <td>${esc(String(it.creado || '').slice(0, 10))}</td>
      </tr>`;
    }).join('')}</tbody></table>`;

  $$('#tabla th').forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    if (orden.col === c) orden.asc = !orden.asc; else { orden.col = c; orden.asc = true; }
    pintarMatriz();
  });
  $$('#tabla tbody tr').forEach(tr => tr.onclick = () => abrirFicha(tr.dataset.cod));
}

/* ── ficha ── */
function abrirFicha(cod) {
  const it = ITEMS.find(x => x.codigo === cod);
  if (!it) return;
  const d = it.datos;
  const terr = (d.territorios || []);
  $('#ficha').innerHTML = `
    <h2 class="tit">${esc(d.nombre || 'Sin nombre')}</h2>
    <p class="sub">${esc(it.codigo)} · registrada el ${esc(String(it.creado || '').slice(0, 10))}</p>
    <dl>
      <dt>Tipo</dt><dd>${esc(tipoDe(it))}</dd>
      <dt>Nivel</dt><dd>${esc(d.nivel || '—')}</dd>
      <dt>Acciones</dt><dd>${(d.acciones || []).length
        ? (d.acciones).map(a => `<span class="chip">${esc(a)}</span>`).join('') : '—'}</dd>
      <dt>Territorios</dt><dd>${terr.length
        ? terr.map(t => `<b>${esc(t.dpto)}:</b> ${esc(t.municipios.join(', '))}`).join('<br>') : '—'}</dd>
      <dt>Correo<span class="reserva">reservado</span></dt><dd>${esc(d.correo || '—')}</dd>
      <dt>Teléfono<span class="reserva">reservado</span></dt><dd>${esc(d.telefono || '—')}</dd>
      <dt>Contacto<span class="reserva">reservado</span></dt><dd>${esc(d.persona || '—')}</dd>
      <dt>Habeas data</dt><dd>${esc(d.habeas || '—')}</dd>
      <dt>Mapa público</dt><dd>${esc(d.publicar || '—')}</dd>
    </dl>
    <div class="rev">
      <label for="fEstadoRev">Estado de la revisión</label>
      <select id="fEstadoRev">${ESTADOS_ORG.map(e =>
        `<option${e === it.estado ? ' selected' : ''}>${esc(e)}</option>`).join('')}</select>
      <label for="fVinculo">Vínculo con la Red</label>
      <select id="fVinculo">${['Sin contacto todavía', 'Contactada',
        'Participa en un frente de trabajo', 'Organización miembro'].map(v =>
        `<option${v === d.vinculo ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <label for="fQuien">Quién verificó</label>
      <input id="fQuien" value="${esc(d.verificado_por || '')}">
      <label for="fObs">Observaciones</label>
      <textarea id="fObs">${esc(d.observaciones || '')}</textarea>
      <div id="errFicha"></div>
      <div class="pie">
        <button class="btn suave" id="btnCerrar">Cerrar</button>
        <button class="btn" id="btnGuardar">Guardar</button>
      </div>
    </div>`;
  $('#velo').classList.add('viva');
  $('#btnCerrar').onclick = () => $('#velo').classList.remove('viva');
  $('#btnGuardar').onclick = async () => {
    const b = $('#btnGuardar');
    b.disabled = true; b.textContent = 'Guardando…';
    const datos = Object.assign({}, d, {
      vinculo: $('#fVinculo').value,
      verificado_por: $('#fQuien').value.trim(),
      observaciones: $('#fObs').value.trim(),
    });
    const r = await pedir({ accion: 'org_guardar', sesion: SESION, codigo: it.codigo,
                            estado: $('#fEstadoRev').value, datos });
    b.disabled = false; b.textContent = 'Guardar';
    if (!r.ok) { $('#errFicha').innerHTML = `<div class="error">${esc(r.error)}</div>`; return; }
    $('#velo').classList.remove('viva');
    cargar();
  };
}
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') $('#velo').classList.remove('viva'); });

/* ── tablero ── */
function cuenta(lista) {
  const c = {};
  lista.forEach(v => { if (v) c[v] = (c[v] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
function barras(sel, pares) {
  const tope = Math.max(1, ...pares.map(p => p[1]));
  $(sel).innerHTML = pares.length
    ? pares.map(([v, n]) => `<div class="barra-f"><span>${esc(v)}</span>
        <span class="via"><i style="width:${Math.round(n / tope * 100)}%"></i></span>
        <span class="c">${n}</span></div>`).join('')
    : '<p class="vacio" style="padding:14px">Sin datos todavía.</p>';
}
function pintarTablero() {
  const munis = new Set();
  ITEMS.forEach(it => (it.datos.territorios || []).forEach(t =>
    t.municipios.forEach(m => munis.add(t.dpto + '|' + m))));
  const dptos = new Set(ITEMS.flatMap(dptosDe));
  const vinculadas = ITEMS.filter(it => it.estado === 'Vinculado').length;

  $('#cifras').innerHTML = [
    [ITEMS.length, 'organizaciones registradas'],
    [dptos.size, 'departamentos con presencia'],
    [munis.size, 'municipios cubiertos'],
    [vinculadas, 'ya vinculadas a la Red'],
  ].map(([n, q]) => `<div class="tarj"><div class="n">${n}</div><div class="q">${esc(q)}</div></div>`).join('');

  barras('#porTipo', cuenta(ITEMS.map(tipoDe)));
  barras('#porAccion', cuenta(ITEMS.flatMap(it => it.datos.acciones || [])));
  barras('#porDpto', cuenta(ITEMS.flatMap(dptosDe)));
  barras('#porEstado', cuenta(ITEMS.map(it => it.estado || 'Recibido')));
}

/* ── pestañas ── */
$$('.pest button').forEach(b => b.onclick = () => {
  $$('.pest button').forEach(x => x.classList.toggle('on', x === b));
  $$('.vista').forEach(v => v.classList.toggle('viva',
    v.id === 'v' + b.dataset.v[0].toUpperCase() + b.dataset.v.slice(1)));
});

/* ── exportar ── */
$('#btnExcel').addEventListener('click', () => {
  const vis = visibles();
  const columnas = ['Código', 'Organización', 'Tipo', 'Nivel', 'Departamentos',
                    'Municipios', 'Acciones de interés', 'Estado', 'Vínculo', 'Registro'];
  const filas = [];
  vis.forEach(it => {
    const d = it.datos, t = d.territorios || [];
    filas.push([it.codigo, d.nombre || '', tipoDe(it), d.nivel || '',
      t.map(x => x.dpto).join('; '),
      t.map(x => x.dpto + ': ' + x.municipios.join(', ')).join(' | '),
      (d.acciones || []).join('; '), it.estado || '', d.vinculo || '',
      String(it.creado || '').slice(0, 10)]);
  });
  aExcel('organizaciones_aliadas', [{ nombre:'Organizaciones', columnas, filas }]);
});

/* ══════════════════════════════════════════════════════════════════════
   Exportar una tabla a Excel o a Word

   Excel: se arma un .xlsx de verdad (ZIP con las partes que Excel exige),
   no un CSV disfrazado, para que los números lleguen como números y las
   tildes no se rompan.
   Word: se reusa docxRed, así el documento sale con la línea gráfica.

   Depende de zip(), xmlEsc(), docxRed() y bajar(), que vienen de docx_red.js
   ══════════════════════════════════════════════════════════════════════ */

/* la letra de columna: 1→A, 27→AA */
function colLetra(n) {
  let s = '';
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
}

const esNumero = v => v !== '' && v !== null && v !== undefined &&
  typeof v !== 'boolean' && isFinite(Number(String(v).replace(',', '.')));

/* hojas = [{ nombre, columnas:[...], filas:[[...],[...]] }] */
function aExcel(archivo, hojas) {
  /* Excel guarda el texto en una tabla aparte y las celdas apuntan ahí */
  const textos = [], indice = new Map();
  const idTexto = t => {
    const s = String(t == null ? '' : t);
    if (!indice.has(s)) { indice.set(s, textos.length); textos.push(s); }
    return indice.get(s);
  };

  const hojasXml = hojas.map(h => {
    const filas = [];
    const encabezado = h.columnas.map((c, j) =>
      `<c r="${colLetra(j + 1)}1" t="s" s="1"><v>${idTexto(c)}</v></c>`).join('');
    filas.push(`<row r="1">${encabezado}</row>`);

    h.filas.forEach((fila, i) => {
      const celdas = fila.map((v, j) => {
        const ref = colLetra(j + 1) + (i + 2);
        if (esNumero(v)) return `<c r="${ref}"><v>${Number(String(v).replace(',', '.'))}</v></c>`;
        return `<c r="${ref}" t="s"><v>${idTexto(v)}</v></c>`;
      }).join('');
      filas.push(`<row r="${i + 2}">${celdas}</row>`);
    });

    /* anchos: se estiman con el contenido, con tope para que no queden gigantes */
    const anchos = h.columnas.map((c, j) => {
      const largo = Math.max(String(c).length,
        ...h.filas.slice(0, 200).map(f => String(f[j] == null ? '' : f[j]).length));
      return `<col min="${j + 1}" max="${j + 1}" width="${Math.min(Math.max(largo + 3, 10), 60)}" customWidth="1"/>`;
    }).join('');

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${anchos}</cols><sheetData>${filas.join('')}</sheetData></worksheet>`;
  });

  const nombresHoja = hojas.map((h, i) =>
    `<sheet name="${xmlEsc(String(h.nombre || ('Hoja' + (i + 1))).slice(0, 31).replace(/[\\\/\?\*\[\]:]/g, ' '))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');

  const partes = [
    ['[Content_Types].xml',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`],
    ['_rels/.rels',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`],
    ['xl/workbook.xml',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${nombresHoja}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}
<Relationship Id="rIdStr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>
<Relationship Id="rIdSty" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`],
    ['xl/styles.xml',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF46551F"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>
</styleSheet>`],
    ['xl/sharedStrings.xml',
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${textos.length}" uniqueCount="${textos.length}">
${textos.map(t => `<si><t xml:space="preserve">${xmlEsc(t)}</t></si>`).join('')}</sst>`],
  ];
  hojasXml.forEach((x, i) => partes.push(['xl/worksheets/sheet' + (i + 1) + '.xml', x]));

  const blob = zip(partes);
  bajar(new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
        archivo.replace(/\.xlsx$/, '') + '.xlsx');
}

/* ── Word: la misma tabla, dentro del documento con la línea gráfica ── */
function aWord(archivo, titulo, bloques) {
  const parrafos = [];
  for (const b of bloques) {
    if (b.titulo) parrafos.push(['h2', b.titulo]);
    if (b.nota) parrafos.push(['nota', b.nota]);
    parrafos.push(['tabla', { columnas: b.columnas, filas: b.filas }]);
  }
  bajar(docxRed({
    antetitulo: 'Radar Agrario',
    titulo: titulo,
    parrafos: parrafos,
    pie: 'Datos tomados de fuentes públicas por el Radar Agrario de la Red Nacional por la '
       + 'Defensa de la Reforma Agraria. Verifique contra la fuente antes de publicar.',
  }), archivo.replace(/\.docx$/, '') + '.docx');
}
