<title>Panel de líneas — Red Nacional por la Defensa de la Reforma Agraria</title>
<style>
:root{--olivo-hondo:#2F3A1A;--olivo:#46551F;--ocre:#B87A20;--arena:#E8C48F;
  --papel:#fff;--tinta:#1C2113;--gris:#5F6752;--linea:#DBE1CE;--alerta:#B3231F}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(150deg,var(--olivo-hondo),#151B0D);color:var(--tinta);
  font:400 15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.caja{background:var(--papel);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.45);
  padding:34px 32px 28px;width:100%;max-width:420px}
img{width:150px;height:auto;margin:0 auto 22px;display:block}
h1{font-size:19px;color:var(--olivo);text-align:center;margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.02em}
.sub{text-align:center;font-size:13px;color:var(--gris);margin-bottom:22px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input{width:100%;font:400 15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  color:var(--tinta);background:#ECF0E4;border:1.5px solid var(--linea);
  border-radius:9px;padding:11px 13px}
input:focus{border-color:var(--ocre);outline:none;box-shadow:0 0 0 3px rgba(184,122,32,.22)}
button{width:100%;margin-top:14px;font:600 15px/1 inherit;border:0;border-radius:9px;
  padding:14px;cursor:pointer;background:var(--olivo);color:#fff}
button:disabled{opacity:.55;cursor:default}
.error{background:#FBECEB;border:1.5px solid #E5B4B2;border-radius:9px;padding:10px 13px;
  font-size:13.5px;color:var(--alerta);margin-bottom:14px}
.pie{font-size:12px;color:var(--gris);margin-top:18px;text-align:center;line-height:1.55}
</style></head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

async function abrir(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave),
    'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt:b64(SAL), iterations:VUELTAS, hash:'SHA-256' }, base, 256);

  /* se compara la huella antes de descifrar: si la clave está mal, se avisa
     de una vez en lugar de intentar descifrar megas de datos */
  const mezcla = new Uint8Array(bits.byteLength + 6);
  mezcla.set(new Uint8Array(bits), 0);
  mezcla.set(new TextEncoder().encode('huella'), bits.byteLength);
  const comprobar = hex(await crypto.subtle.digest('SHA-256', mezcla)).slice(0, 32);
  if (comprobar !== HUELLA) return null;

  const llave = await crypto.subtle.importKey('raw', bits, 'AES-CBC', false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({ name:'AES-CBC', iv:b64(IV) }, llave, b64(DATOS));
  return new TextDecoder().decode(claro);
}

document.getElementById('puerta').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('error');
  b.disabled = true; b.textContent = 'Abriendo…'; err.innerHTML = '';
  let html = null;
  try { html = await abrir(document.getElementById('c').value.trim()); }
  catch (x) { html = null; }
  if (!html) {
    b.disabled = false; b.textContent = 'Abrir';
    err.innerHTML = '<div class="error">Esa contraseña no es. Revise que no le sobre un espacio al final.</div>';
    document.getElementById('c').select();
    return;
  }
  document.open(); document.write(html); document.close();
});
})();
